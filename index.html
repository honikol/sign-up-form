<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign up form</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="left-pane">
            <h1><img src="odin-lined.png">ODIN</h1>
            <footer>Photo by <a href="https://www.haliewestphotography.com/">Halie West</a> on <a href="https://unsplash.com/">Unsplash</a></footer>
        </div>
        <div class="right-pane">
            <div class="top">
                <p>This is not a real online service! You know you need something like this in your life to help you realize your deepest dreams. Sign up <i>now</i> to get started.</p>
                <p> You <i>know</i> you want to.</p>
            </div>
            <div class="middle">
                <h1>Let's do this!</h1>
                <form method="post" id="signup-form">
                    <div class="left">
                        <div>
                            <label for="first_name">FIRST NAME</label>
                            <input type="text" name="first_name" id="first_name" required>
                        </div>
                        <div>
                            <label for="email">EMAIL</label>
                            <input type="email" name="email" id="email">
                        </div>
                        <div>
                            <label for="password">PASSWORD</label>
                            <input type="password" name="password" id="password" required>
                        </div>
                    </div>
                    <div class="right">
                        <div>
                            <label for="last_name">LAST NAME</label>
                            <input type="text" name="last_name" id="last_name" required>
                        </div>
                        <div>
                            <label for="phone">PHONE NUMBER</label>
                            <input type="tel" name="phone" id="phone">
                        </div>
                        <div>
                            <label for="password_conf">CONFIRM PASSWORD</label>
                            <input type="password" name="password_conf" id="password_conf" required>
                        </div>    
                    </div>    
                </form>
            </div>
            <div class="bottom">
                <button type="submit" form="signup-form">Create Account</button>
                <p>Already have an account? <a href="#">Log in</a></p>
            </div>
        </div>
    </div>
</body>
</html>
